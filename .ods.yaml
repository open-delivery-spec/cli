# ODS Compliance Policy Configuration
# Dogfooding: this repo validates itself with ODS.

profile: enterprise

policy:
  branch:
    allowed_types:
      - feature
      - feat
      - bugfix
      - fix
      - hotfix
      - release
      - chore
    require_ticket: false
    max_description_length: 100

  pr:
    required_sections:
      - "## Summary"
      - "## Type"
      - "## AI Disclosure"
      - "## Changes"
      - "## Testing"
      - "## Checklist"
    min_changes: 1

  commit:
    allowed_types:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert
    require_scope: true
    max_subject_length: 72

  ai_disclosure:
    required: true
    strict_tool_name: true
    require_human_review: true
    ai_branch_naming: warning

  severity:
    branch_type: error
    branch_format: error
    pr_sections: error
    pr_ai_disclosure: error
    pr_ai_tool: error
    commit_type: error
    commit_scope: warning
    commit_ai: error
