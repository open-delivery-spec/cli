# ODS Validate — Dogfooding workflow for the CLI repository
#
# Runs AI code quality gate on every PR to main.

name: ODS Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dogfooding installs the CLI at a fresh commit SHA; sum.golang.org
      # intermittently 500s while verifying an unreleased pseudo-version.
      # Skip checksum-DB verification here — this is our own just-built
      # code, and adopters pinned to a released tag are unaffected.
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Conventional branch & commit checks
        run: |
          python3 -m pip install 'commit-check>=2.9.0'
          commit-check --message --branch

      - name: Validate PR description
        run: |
          echo "Checking PR description structure..."
          echo "PR title: ${{ github.event.pull_request.title }}"

      # Dogfood mutation testing: run gremlins on the packages this PR changed,
      # scoped to the diff by ods check --mutation. Advisory — the script never
      # fails the job — and skips the slow e2e package.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false

      - name: Diff-scoped mutation report (advisory)
        timeout-minutes: 15
        run: bash .github/scripts/mutation-report.sh "${{ github.event.pull_request.base.sha || 'origin/main' }}" gremlins.json

      - name: ODS AI code quality gate
        uses: open-delivery-spec/validate-action@v1
        with:
          diff-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          branch: ${{ github.head_ref }}
          mutation-report: gremlins.json
          # Dogfood the CLI version under test, not main. Otherwise an analyzer
          # behaviour change is judged by the old analyzer it replaces, and any
          # PR that adjusts the rules can never pass its own gate. Use the head
          # SHA, not the branch name: `go install pkg@branch` rejects refs that
          # contain a slash (e.g. bugfix/...).
          cli-ref: ${{ github.event.pull_request.head.sha }}
          summary: 'true'
          comment: 'true'
