name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  conformance:
    name: Spec conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: open-delivery-spec/spec
          path: spec-repo
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      # Two layers: internal/policy evaluates the Rego semantics directly,
      # internal/e2e runs the same scenarios through the built binary to check
      # the CLI contract (check-output JSON shape and the gating exit code).
      - name: Run conformance scenarios against this implementation
        env:
          ODS_CONFORMANCE_DIR: ${{ github.workspace }}/spec-repo/spec/conformance
        run: go test ./internal/policy ./internal/e2e -run TestConformance -v

  dogfood:
    name: Dogfood (test ODS on itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - name: Build ods CLI
        run: go build -o ods ./cmd/ods

      # ── AI Code Detection ──
      - name: Detect AI code (branch)
        run: ./ods detect --branch feature/ai-oauth --json | tee /dev/stderr

      - name: Detect AI code (PR body)
        run: |
          ./ods detect --pr-body "## AI Disclosure
          - [x] This PR contains AI-generated code
          - **AI Tool:** GitHub Copilot" --json | tee /dev/stderr

      - name: Detect AI code (no AI)
        run: ./ods detect --branch feature/add-login --json | tee /dev/stderr

      - name: Detect AI code (high confidence block)
        run: |
          ! ./ods detect --pr-body "## AI Disclosure
          - [x] This PR contains AI-generated code
          - **AI Tool:** GitHub Copilot" 2>/dev/null

      # ── AI Code Quality Analysis ──
      - name: Analyze AI-like code
        run: |
          cat > /tmp/ai-test.go <<'GO'
          // This function authenticates the user
          // It validates credentials against the database
          // Returns a session token on success
          func authenticate_user(creds interface{}) error {
              var data interface{}
              json.Unmarshal([]byte("{}"), &data)
              if err != nil { return err }
              if err != nil { return err }
              return nil
          }
          GO
          ./ods analyze --file /tmp/ai-test.go --json | tee /dev/stderr

      - name: Analyze safe code
        run: |
          cat > /tmp/safe-test.go <<'GO'
          package main
          func add(a, b int) int { return a + b }
          GO
          ./ods analyze --file /tmp/safe-test.go --json | tee /dev/stderr

      # ── Technical Debt Scoring ──
      - name: Score tech debt
        run: ./ods score --json | tee /dev/stderr

      # ── OPA Policy Check ──
      - name: OPA policy check
        run: ./ods check --json | tee /dev/stderr
