name: 'ODS Validate'
description: 'Run Open Delivery Spec compliance checks and upload SARIF results'
author: 'open-delivery-spec'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  check:
    description: 'Comma-separated list of checks to run, or "all" for everything'
    required: false
    default: 'all'
  branch_name:
    description: 'Branch name to validate'
    required: false
  commit_message:
    description: 'Commit message to validate'
    required: false
  pr_body:
    description: 'PR body to validate'
    required: false
  strict:
    description: 'Treat warnings as errors'
    required: false
    default: 'false'
  threshold:
    description: 'Fail if score is below this threshold (0-100)'
    required: false
    default: '0'
  format:
    description: 'Output format: sarif, json, markdown'
    required: false
    default: 'sarif'
  policy:
    description: 'Path to policy YAML file'
    required: false
  profile:
    description: 'Policy profile: oss, enterprise, or regulated'
    required: false
    default: 'enterprise'
  github_token:
    description: 'GitHub token for PR comments (optional)'
    required: false
    default: ${{ github.token }}
  upload_sarif:
    description: 'Upload SARIF results to GitHub Code Scanning'
    required: false
    default: 'true'

outputs:
  status:
    description: 'Compliance status (compliant, compliant_with_warnings, non_compliant)'
    value: ${{ steps.ods.outputs.status }}
  score:
    description: 'Compliance score (0-100)'
    value: ${{ steps.ods.outputs.score }}
  sarif_file:
    description: 'Path to SARIF output file'
    value: ${{ steps.ods.outputs.sarif_file }}

runs:
  using: 'composite'
  steps:
    - name: Run ODS Compliance Check
      id: ods
      shell: bash
      env:
        ODS_BRANCH_NAME: ${{ inputs.branch_name }}
        ODS_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        ODS_PR_BODY: ${{ inputs.pr_body }}
        ODS_REPOSITORY: ${{ github.repository }}
        ODS_REF: ${{ github.ref_name }}
        ODS_SHA: ${{ github.sha }}
        ODS_PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
      run: |
        set -euo pipefail

        echo "::group::ODS Compliance Check"
        
        # Build args
        ARGS="--format ${{ inputs.format }}"
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS="$ARGS --strict"
        fi
        if [ -n "${{ inputs.policy }}" ]; then
          ARGS="$ARGS --policy ${{ inputs.policy }}"
        fi
        
        # Set profile
        export ODS_PROFILE="${{ inputs.profile }}"
        
        # Run ods report
        ods report $ARGS --output ods-result 2>&1 | tee ods-summary.txt || true
        
        # Extract status
        STATUS=$(grep -oP 'Status: \K.*' ods-summary.txt | head -1 || echo "non_compliant")
        SCORE=$(grep -oP 'Score: \K[0-9]+' ods-summary.txt | head -1 || echo "0")
        
        echo "status=$STATUS" >> $GITHUB_OUTPUT
        echo "score=$SCORE" >> $GITHUB_OUTPUT
        
        # Set SARIF file path (always generated even if format is not sarif)
        if [ -f "ods-result/ods-compliance.sarif" ]; then
          echo "sarif_file=ods-result/ods-compliance.sarif" >> $GITHUB_OUTPUT
        fi
        
        # Write step summary
        if [ -f "ods-result/ods-summary.md" ]; then
          cat ods-result/ods-summary.md >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "::endgroup::"
        
        # Threshold check
        THRESHOLD="${{ inputs.threshold }}"
        if [ "$THRESHOLD" != "0" ] && [ "$SCORE" -lt "$THRESHOLD" ]; then
          echo "::error::ODS score $SCORE is below threshold $THRESHOLD"
          exit 1
        fi
        
        # Exit with error if non-compliant
        if [ "$STATUS" = "non_compliant" ]; then
          echo "::warning::ODS report is non-compliant"
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload_sarif == 'true' && steps.ods.outputs.sarif_file != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.ods.outputs.sarif_file }}
        category: ods-compliance

    - name: Comment PR with ODS Results
      if: ${{ github.event_name == 'pull_request' && inputs.github_token != '' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          
          let summary = '';
          try {
            summary = fs.readFileSync('ods-result/ods-summary.md', 'utf8');
          } catch (e) {
            summary = `## ODS Compliance Report

          **Status:** ${process.env.STATUS || 'unknown'}
          **Score:** ${process.env.SCORE || '0'} / 100

          Full report available in the workflow run.`;
          }
          
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          // Find existing ODS comment
          const odsComment = comments.find(c => 
            c.user.login === 'github-actions[bot]' && 
            c.body.includes('ODS Compliance Report')
          );
          
          if (odsComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: odsComment.id,
              body: summary,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            });
          }
