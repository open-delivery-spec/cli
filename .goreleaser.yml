version: 2

project_name: ods

before:
  hooks:
    - go mod tidy

builds:
  - id: ods
    main: ./cmd/ods
    binary: ods
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/open-delivery-spec/cli/internal/version.Value={{.Version}}
      - -X github.com/open-delivery-spec/cli/internal/version.Version={{.Version}}
      - -X github.com/open-delivery-spec/cli/internal/version.Commit={{.Commit}}
      - -X github.com/open-delivery-spec/cli/internal/version.Date={{.Date}}

archives:
  - id: ods
    builds:
      - ods
    name_template: "ods_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "ods_{{ .Version }}_checksums.txt"

release:
  github:
    owner: open-delivery-spec
    name: cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
